<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0a0c14}</style></head>
<body><canvas id="c" width="1500" height="800"></canvas>
<script src="../renderer/city.js"></script>
<script>
  // BIOME PROBE — one still frame of a chosen city LIFE at a chosen age.
  // Deliberately does NOT load renderer/index.html: that shell's control bar re-runs applyOverrides()
  // from inside an IIFE and RESETS NOWOVR/FORCEAGE every frame, so anything injected into the app
  // page is silently undone a frame later. Driving setup()/draw() here is the only reliable way to
  // pin a life. ?life=N picks the life (clock is placed inside it), ?age=0..1 the city's maturity.
  window.NOFETCH=true;
  var Q=new URLSearchParams(location.search);
  var life=parseInt(Q.get('life')||'0',10), age=parseFloat(Q.get('age')||'0.30');
  window.GROW_CYCLE=604800000;                            // no config.js here, so pin the weekly cycle
  var CYC=604800000, EPOCH=1783972450746;                 // must match GROW_CYCLE (cycle "1w") + GROW_EPOCH
  window.NOWOVR = EPOCH + life*CYC + Math.round(0.45*CYC);
  // ?hour=13 snaps the clock to that hour of the SAME day so palettes can be judged in daylight.
  // A shift of at most half a day cannot move a week-long life, so the biome is unaffected.
  if(Q.get('hour')!==null){
    var hh=parseFloat(Q.get('hour')), dd=new Date(window.NOWOVR);
    dd.setHours(hh|0,Math.round((hh%1)*60),0,0); window.NOWOVR=dd.getTime();
  }
  // ?nowms=<epoch ms> pins the clock ABSOLUTELY, overriding ?life/?hour. Needed for anything whose
  // arc is a function of the clock rather than of the city's age — the treeline battle only exists for
  // four minutes inside a 42-hour slot, so "life 50 at 1pm" cannot land on it. Find the moment with a
  // node probe against titanEvent(), then render it here.
  if(Q.get('nowms')!==null) window.NOWOVR=parseInt(Q.get('nowms'),10);
  // ?egg=leaf summons a rare homage land instead of waiting for the ~1-in-12 roll.
  // ⚠ Sets FORCEEGG *directly*, not CITYLIVE_CFG. The config object is read by city.js at LOAD time and
  // this script runs after the <script src> above it, so a CITYLIVE_CFG written here is always too late
  // — which silently gave the wrong land and looked like a broken override.
  if(Q.get('egg')!==null) window.FORCEEGG=Q.get('egg');
  window.CLOCK  = window.NOWOVR;
  window.FORCEAGE = age;
  // ?wx=<WMO code> pins the weather BEFORE setup, so maybeFetchWeather() never overwrites it (see
  // FORCEWX in city.js; wfx() derives fog/drizzle/rain/snow/thunder/freezing from the code). Without
  // this the probe could only ever show a clear day, and "does this biome work in the rain" was not
  // a question it could answer — a feature that is correctly invisible in fair weather looks exactly
  // like a feature that is broken. ?wet=0..1 pins how soaked the ground already is: puddles build up
  // over real minutes of rain, so a single still frame starts with a dry street otherwise.
  if(Q.get('wx')!==null){
    var wc=parseInt(Q.get('wx'),10);
    var frozen=[56,57,66,67,71,73,75,77,85,86].indexOf(wc)>=0;
    window.FORCEWX={code:wc,cloud:92,wind:parseFloat(Q.get('wind')||'14'),
                    temp:parseFloat(Q.get('temp')||(frozen?'26':'56')),precip:2.4,feels:null,gust:24};
  }
  var cv=document.getElementById('c'), g=cv.getContext('2d');
  try{
    setup('neon',{cw:1500,ch:800,woff:0,ww:1500,pxk:3,zoom:1,quality:'spectacle'});
    if(Q.get('wet')!==null) wetness=parseFloat(Q.get('wet'));
    if(Q.get('snowpack')!==null) snowpack=parseFloat(Q.get('snowpack'));
    // ?wind=N&temp=N override the fetched observation AFTER setup, so the biome weather accents
    // (dust devils, sea spray, wind waves) can be seen on demand — they are deliberately keyed to
    // the REAL measurement, so on a calm day they correctly draw nothing at all and a render taken
    // without this looks identical to one with the feature missing.
    if(Q.get('wind')!==null) weather.wind=parseFloat(Q.get('wind'));
    if(Q.get('temp')!==null) weather.temp=parseFloat(Q.get('temp'));
    for(var f=0;f<3;f++) draw(g);
    if(Q.get('wet')!==null) wetness=parseFloat(Q.get('wet'));    // draw() ages wetness; re-pin, then repaint
    if(Q.get('snowpack')!==null) snowpack=parseFloat(Q.get('snowpack'));
    draw(g);
    var _d=new Date(window.NOWOVR);
    window._named = 'life='+curLife+' biome='+curBiome.k+' ocean='+hasOcean+' river='+hasRiver+
                    ' date='+(_d.getMonth()+1)+'/'+_d.getDate()+
                    ' wx='+JSON.stringify(wfx())+' wet='+wetness.toFixed(2)+' snowpack='+snowpack.toFixed(2)+
                    ' wind='+weather.wind+
                    ' peaks='+(mts?(mts.far.length+mts.near.length):0)+
                    ' trees='+(bioTrees?(bioTrees.far.length+bioTrees.near.length):0);
  }catch(e){ window._named='ERR:'+e.message; }
</script></body></html>
