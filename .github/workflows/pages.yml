name: Deploy web build to GitHub Pages

# Publishes the browser build (web/) to https://deluxescout1.github.io/citylive/ .
# That URL is what a Windows user pastes into Lively Wallpaper to run CityLive as a
# real animated desktop background. Redeploys whenever web/ changes.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'phone/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish BOTH browser builds. `web/` stays at the root because that URL is already what a
      # Windows user pastes into Lively Wallpaper, and moving it would break their setup. `phone/`
      # goes to /phone/ because it is the one with a manifest.json — on Android or iOS that is
      # "Add to Home screen" and you get a fullscreen PWA instead of a browser tab. Without this the
      # phone build existed in the repo and there was no way to actually open it on a phone.
      - name: Stage both browser builds
        run: |
          mkdir -p _site
          cp -r web/. _site/
          mkdir -p _site/phone
          cp -r phone/. _site/phone/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
