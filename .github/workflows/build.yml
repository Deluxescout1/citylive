name: Build CityLive desktop apps

# Builds native installers on each OS's own runner, so the Windows .exe and macOS
# .dmg are produced with their real toolchains (they cannot be built from Linux).
# Trigger by pushing a version tag (e.g. v1.0.0) or from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: dist:linux
            artifact: linux-installers
          - os: windows-latest
            target: dist:win
            artifact: windows-installer
          - os: macos-latest
            target: dist:mac
            artifact: macos-installer
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Unit tests
        run: npm test

      - name: Build installer
        # Build only — do NOT publish from here (these jobs are read-only; the release
        # job below publishes). electron-builder still emits the latest*.yml auto-update
        # manifests into dist/ because package.json has a publish config.
        run: npm run ${{ matrix.target }} -- --publish never
        env:
          # unsigned builds are fine for personal use; CSC_* secrets enable signing if added
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify koffi native binary is packaged + loads (Windows wallpaper mode)
        # The behind-icons wallpaper needs koffi's win32 .node, which lives in the separate
        # @koromix/koffi-win32-x64 package and MUST be asar-unpacked. If it isn't shipped or
        # can't dlopen, wallpaper.available() silently returns false and the feature dies.
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $root = "dist/win-unpacked/resources/app.asar.unpacked/node_modules"
          $paths = @(
            "$root/@koromix/koffi-win32-x64/win32_x64/koffi.node",
            "$root/koffi/build/koffi/win32_x64/koffi.node"
          )
          $found = $paths | Where-Object { Test-Path $_ }
          if (-not $found) {
            Write-Error "koffi win32 .node not found in packaged app. Checked: $($paths -join '; ')"
            Get-ChildItem -Recurse "$root/@koromix" -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
          Write-Host "Found packaged koffi native binary: $($found -join ', ')"
          # Prove the win32 prebuilt actually dlopens (N-API → Node/Electron share the ABI).
          node -e "const k=require('koffi'); k.load('user32.dll'); console.log('koffi win32 dlopen OK')"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Include the update manifests (*.yml) + delta maps (*.blockmap) so electron-updater works.
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          if-no-files-found: ignore

  release:
    # When triggered by a version tag, gather every OS's installers into one GitHub Release.
    # always() → publish whatever built even if one OS's leg flaked (a mac hiccup must not
    # hold the Windows installer hostage).
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      # Only publish when installers actually exist. always() lets this job run even if one OS leg
      # flaked (mac hiccup must not block the Windows installer) — but if EVERY build failed there are
      # no artifacts, and publishing anyway created an empty DRAFT release that then collided on the
      # next tag run (duplicate-draft removal → "Not Found" asset race → the job failed & emailed).
      # This guard skips cleanly on total failure: no empty release, no collision, no failure email.
      - name: Check for built installers
        id: haveart
        run: |
          if [ -n "$(find artifacts -type f 2>/dev/null | head -1)" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      # ⚠⚠ IS THE SET *COMPLETE*? The check above only asks "did ANYTHING build", which is why v3.0.1
      # first shipped broken: the Windows leg failed a unit test, mac and linux succeeded, artifacts
      # existed, and the release published live and `make_latest` with NO Windows installer and NO
      # latest.yml. `releases/latest/download/latest.yml` then 404'd and Windows auto-update was dead
      # for everyone on the previous version — a silent, user-facing outage caused by a green-ish run.
      # The three update manifests are what electron-updater actually fetches, so they are the test.
      # This keeps the original intent (one flaky OS leg must not hold the others hostage): an
      # incomplete set still publishes, but as a DRAFT that is never `latest`, so nobody auto-updates
      # into a hole — and the job then FAILS so it cannot pass unnoticed.
      - name: Is the installer set complete?
        id: complete
        if: ${{ steps.haveart.outputs.found == 'true' }}
        run: |
          missing=""
          for f in latest.yml latest-mac.yml latest-linux.yml; do
            [ -n "$(find artifacts -type f -name "$f" 2>/dev/null | head -1)" ] || missing="$missing $f"
          done
          if [ -z "$missing" ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
            echo "Complete: all three update manifests present."
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
            echo "::warning::INCOMPLETE RELEASE — missing:$missing. Publishing as a DRAFT so it never becomes 'latest'."
          fi
      - name: Publish release
        id: publish
        if: ${{ steps.haveart.outputs.found == 'true' }}
        continue-on-error: true          # softprops intermittently 404s on an asset UPDATE mid-upload (has aborted the job & left a draft twice) — the assets still land; the next step guarantees publication
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: ${{ steps.complete.outputs.all != 'true' }}
          make_latest: ${{ steps.complete.outputs.all == 'true' }}
      - name: Ensure the release is published        # belt-and-suspenders: even if the action above flaked mid-upload, the release exists with its assets — flip it live so electron-updater sees it
        if: ${{ always() && steps.haveart.outputs.found == 'true' && steps.complete.outputs.all == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest --repo "${{ github.repository }}"
      # Fail loudly on an incomplete set. The draft above preserves the work — nothing is lost and the
      # assets that DID build are attached — but a partial release must never be mistaken for a good
      # one, and a green run is exactly how the last one slipped through.
      - name: Refuse to call an incomplete release good
        if: ${{ always() && steps.haveart.outputs.found == 'true' && steps.complete.outputs.all != 'true' }}
        run: |
          echo "::error::Release ${{ github.ref_name }} is INCOMPLETE and was left as a DRAFT."
          echo "Fix the failing build leg, delete the draft and its tag, then re-tag."
          exit 1
